[package]
name = "airfry-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Load generator and benchmark harness for Airfry: smoke/load/req/mixed/store workloads with latency percentiles"
repository = "https://github.com/barrydeen/Airfry"
homepage = "https://github.com/barrydeen/Airfry"
documentation = "https://docs.rs/airfry-bench"
readme = "README.md"
keywords = ["nostr", "benchmark", "load-testing", "relay", "performance"]
categories = ["development-tools::benchmarking", "network-programming"]
authors = ["Barry Deen <barrydeen@protonmail.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "airfry-bench"
path = "src/main.rs"

[dependencies]
airfry-core = { workspace = true }
airfry-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
