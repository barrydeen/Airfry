[package]
name = "airfry-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "High-throughput Nostr relay server for Airfry: WebSocket NIP-01/09/11/40/42/45 over a custom storage engine"
repository = "https://github.com/barrydeen/Airfry"
homepage = "https://github.com/barrydeen/Airfry"
documentation = "https://docs.rs/airfry-relay"
readme = "README.md"
keywords = ["nostr", "relay", "websocket", "server", "nip"]
categories = ["network-programming", "web-programming::websocket"]
authors = ["Barry Deen <barrydeen@protonmail.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "airfry_relay"
path = "src/lib.rs"

[[bin]]
name = "airfry-relay"
path = "src/main.rs"

[dependencies]
airfry-core = { workspace = true }
airfry-store = { workspace = true }
airfry-negentropy = { path = "../airfry-negentropy" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
airfry-core = { workspace = true }
